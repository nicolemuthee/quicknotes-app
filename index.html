<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QuickNotes</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header>
      <h1>QuickNotes</h1>
      <p>Capture your thoughts in seconds.</p>
    </header>

    <main>
      <section>
        <h2>Add a note</h2>

        <form id="note-form">
          <label for="note-input">Note</label>

          <input
            type="text"
            id="note-input"
            placeholder="Write a note..."
            maxlength="200"
          />
          <p id="character-count">0 / 200 characters</p>
          <select id="note-category">
            <option value="Personal">Personal</option>
            <option value="Work">Work</option>
            <option value="Study">Study</option>
          </select>

          <button type="submit">Add Note</button>
        </form>

        <p id="error-message"></p>
      </section>

      <section>
        <h2>Your notes</h2>
        <input
          type="text"
          id="search-input"
          placeholder="Search your notes..."
        />
        <select id="category-filter">
          <option value="All">All Categories</option>
          <option value="Personal">Personal</option>
          <option value="Work">Work</option>
          <option value="Study">Study</option>
        </select>

        <ul id="notes-list"></ul>
        <button type="button" id="clear-all-btn">Clear All Notes</button>

        <p id="note-count"></p>
      </section>
    </main>

    <footer>QuickNotes © 2026</footer>
    <script src="script.js"></script>
  </body>
</html>
